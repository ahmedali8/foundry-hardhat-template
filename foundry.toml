# Full reference https://github.com/foundry-rs/foundry/tree/master/config

[profile.default]
  auto_detect_solc = false
  bytecode_hash = "none"
  cbor_metadata = false
  evm_version = "cancun"      # See https://www.evmdiff.com/features?name=PUSH0&kind=opcode
  fs_permissions = [
    { access = "read-write", path = "config/deployments.toml" }
  ]
  gas_reports = ["*"]
  libs = ["node_modules"]
  optimizer = true
  optimizer_runs = 200
  out = "out"
  script = "scripts/foundry"
  solc = "0.8.26"
  src = "contracts"
  test = "tests/foundry"

  [profile.default.fuzz]
    max_test_rejects = 1_000_000 # Number of times `vm.assume` can fail
    runs = 1_000

  [profile.default.invariant]
    call_override = false # Override unsafe external calls to perform reentrancy checks
    depth = 15            # Number of calls executed in one run
    fail_on_revert = true
    runs = 256

# Speed up compilation and tests during development
[profile.lite]
  optimizer = false

[profile.ci]
  fuzz = { runs = 10_000 }
  verbosity = 4

[doc]
  ignore = ["**/*.t.sol"]
  out = "docs"

[etherscan]
  # BASE
  base = { key = "${ETHERSCAN_API_KEY}" }
  base_sepolia = { key = "${ETHERSCAN_API_KEY}" }

  # BINANCE SMART CHAIN
  bnb_smart_chain = { key = "${ETHERSCAN_API_KEY}" }
  bnb_smart_chain_testnet = { key = "${ETHERSCAN_API_KEY}" }

  # ETHEREUM
  mainnet = { key = "${ETHERSCAN_API_KEY}" }
  sepolia = { key = "${ETHERSCAN_API_KEY}" }

  # MATIC/POLYGON
  polygon = { key = "${ETHERSCAN_API_KEY}" }
  polygon_amoy = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[rpc_endpoints]
  # BASE
  base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
  base_sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

  # BINANCE SMART CHAIN
  bnb_smart_chain = "https://bsc-dataseed.binance.org"
  bnb_smart_chain_testnet = "https://rpc.ankr.com/bsc_testnet_chapel"

  # ETHEREUM
  mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
  sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

  # LOCALHOST
  localhost = "http://localhost:8545"

  # MATIC/POLYGON
  polygon = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
  polygon_amoy = "https://polygon-amoy.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
